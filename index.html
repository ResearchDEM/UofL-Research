<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Question Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap">
<style>
/* Layout: one working column for a projector. Six pick tiles in turn order,
   a chooser for the active tile, then the framed question set large in serif, followed by four working
   panels a researcher would need next: breakdown, hours to manuscript, IRB, and where the data lives.
   Palette follows the University of Louisville deck: cardinal red, black, white, ash. */
:root {
  --bg: #F2F4F5;
  --surface: #FFFFFF;
  --wash: #E8ECED;
  --ink: #14191B;
  --muted: #56666B;
  --line: #D1D9DC;
  --accent: #AD0000;
  --accent-text: #AD0000;
  --on-accent: #FFFFFF;
  --bar: #8B9DA1;
  --ok: #1E6B45;
  --ok-bg: #E2F1E8;
  --warn: #8A5A00;
  --warn-bg: #FBEFD5;
  --stop: #AD0000;
  --stop-bg: #F8E3E3;
  --serif: "Source Serif 4", Cambria, Georgia, serif;
  --sans: "Source Sans 3", Calibri, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1315; --surface: #171C1E; --wash: #1F2629; --ink: #ECF0F1; --muted: #9EAFB3; --line: #2B3437;
    --accent: #C21F1F; --accent-text: #F27272; --bar: #6E8287;
    --ok: #7FD1A4; --ok-bg: #173226; --warn: #F0C36A; --warn-bg: #3A2E14; --stop: #F27272; --stop-bg: #3B1A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1315; --surface: #171C1E; --wash: #1F2629; --ink: #ECF0F1; --muted: #9EAFB3; --line: #2B3437;
  --accent: #C21F1F; --accent-text: #F27272; --bar: #6E8287;
  --ok: #7FD1A4; --ok-bg: #173226; --warn: #F0C36A; --warn-bg: #3A2E14; --stop: #F27272; --stop-bg: #3B1A1A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.5 var(--sans);
  padding-inline: clamp(16px, 4vw, 40px);
  padding-block: 28px 56px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.kicker { margin: 0 0 12px; font: 500 0.78rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
h1 { margin: 0 0 12px; font: 700 clamp(2rem, 5.2vw, 3.5rem)/1.05 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0; max-width: 64ch; color: var(--muted); font-size: 1.1rem; }

button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

/* pick tiles */
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile {
  width: 100%; height: 100%; min-width: 0; display: flex; flex-direction: column; gap: 5px; text-align: left;
  padding: 14px 14px 16px; background: var(--surface); color: inherit; border: 1px solid var(--line); border-radius: 6px;
  cursor: pointer; font-size: 1rem;
}
@media (min-width: 620px) { .tile { min-height: 8.25rem; } }
.tile[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tile .who { font: 500 0.72rem/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tile .what { font-weight: 700; font-size: 0.95rem; }
.tile .val { font: 500 1.15rem/1.25 var(--serif); overflow-wrap: anywhere; }
.tile .val.empty { font: 400 0.95rem/1.3 var(--sans); color: var(--muted); }

/* chooser */
.chooser { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px clamp(14px, 3vw, 24px) 20px; display: flex; flex-direction: column; gap: 14px; }
.chooser h2 { margin: 0; font: 700 1.3rem/1.2 var(--serif); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 0.98rem/1.1 var(--sans); padding: 10px 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.domains { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.domain { font: 500 0.78rem/1.1 var(--mono); letter-spacing: 0.04em; padding: 7px 10px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.domain:hover { color: var(--ink); border-color: var(--muted); }
.domain[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--wash); }
.domain .n { opacity: 0.7; margin-left: 4px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-h { margin: 0; font: 500 0.74rem/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chooser-foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; border-top: 1px solid var(--line); padding-top: 16px; }
.custom { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 22rem; }
.custom label { font: 500 0.74rem/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.custom-row { display: flex; gap: 8px; }
.custom input { flex: 1 1 auto; min-width: 0; padding: 10px 12px; font: 400 1rem/1.2 var(--sans); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }

/* buttons */
.btn { font: 700 1rem/1.1 var(--sans); padding: 12px 20px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* result */
.result, .empty-state { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: clamp(18px, 3.5vw, 36px); }
.result { display: flex; flex-direction: column; gap: 26px; }
.tag { margin: 0; font: 500 0.76rem/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.question { margin: 0; font: 500 clamp(1.4rem, 3vw, 2.25rem)/1.3 var(--serif); text-wrap: pretty; overflow-wrap: anywhere; }
.design-line { margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.design-name { font-weight: 700; }
.pill { display: inline-block; font: 500 0.74rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.pill.yes { color: var(--stop); background: var(--stop-bg); }
.pill.maybe { color: var(--warn); background: var(--warn-bg); }
.pill.no { color: var(--ok); background: var(--ok-bg); }
.pill.neutral { color: var(--muted); background: var(--wash); }

.panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 860px) { .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.panel { border-top: 2px solid var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font: 700 1.2rem/1.2 var(--serif); }
.panel .sub { margin: 0; color: var(--muted); font-size: 0.95rem; }
.meta { display: grid; grid-template-columns: minmax(6.5rem, 9.5rem) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.meta dt { font: 500 0.72rem/1.6 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 0.15rem; }
.meta dd { margin: 0; overflow-wrap: anywhere; }

.hours-big { margin: 0; font: 700 clamp(1.8rem, 4vw, 2.6rem)/1 var(--serif); font-variant-numeric: tabular-nums; }
.hours-big small { font: 600 1rem/1 var(--sans); color: var(--muted); margin-left: 6px; }
.phases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.phase { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; font-size: 0.95rem; }
.phase .num { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.phase .track { grid-column: 1 / -1; height: 8px; background: var(--wash); border-radius: 4px; overflow: hidden; }
.phase .fill { height: 100%; background: var(--bar); border-radius: 4px; }
.phase.lead .fill { background: var(--accent); }
.small-list { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; }
.fine { margin: 0; font-size: 0.85rem; color: var(--muted); }

.sources { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.src { display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.src:last-child { border-bottom: 0; padding-bottom: 0; }
.src-name { font-weight: 700; }
.src-access { font: 500 0.72rem/1.4 var(--mono); letter-spacing: 0.04em; color: var(--accent-text); }
.src-note { font-size: 0.93rem; color: var(--muted); }
.src-h { margin: 6px 0 0; font: 500 0.74rem/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.heads { background: var(--warn-bg); color: var(--ink); border-radius: 4px; padding: 12px 14px; margin: 0; }
.heads b { font: 500 0.74rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--warn); margin-right: 8px; }
.warns { display: flex; flex-direction: column; gap: 8px; }
.discuss h3 { margin: 0 0 10px; font: 700 1.2rem/1.2 var(--serif); }
.discuss ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 8px; }
.status { color: var(--muted); font-size: 0.95rem; }
.empty-state { border-style: dashed; background: transparent; }
.empty-state h2 { margin: 0 0 6px; font: 700 1.3rem/1.2 var(--serif); }
.empty-state p { margin: 0; color: var(--muted); }

.similar { border-top: 2px solid var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.similar h3 { margin: 0; font: 700 1.2rem/1.2 var(--serif); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
a.btn .arrow { font-family: var(--mono); font-size: 0.85em; color: var(--muted); }
.claude-box { background: var(--wash); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.claude-box .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.filled { margin: 0; font-size: 0.95rem; }
.filled b { font: 500 0.74rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ok); margin-right: 8px; }

.papers { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 10px; }
.paper { display: flex; flex-direction: column; gap: 2px; }
.paper a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent-text); text-underline-offset: 2px; }
.paper-meta { font-size: 0.88rem; color: var(--muted); font-style: italic; }
.live-count { font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .tile, .chip, .btn, .domain { transition: border-color 0.12s ease, box-shadow 0.12s ease; }
}
</style>
</head>
<body>


<main class="wrap">
  <header>
    <p class="kicker">Research 101 &middot; Group activity</p>
    <h1>Research Question Roulette</h1>
    <p class="lede">Make six picks, one at a time. The page turns them into a research question, then shows where the data lives, whether you need the IRB, and roughly how many hours stand between you and a manuscript.</p>
  </header>

  <section class="stack" aria-label="The six picks">
    <ol class="tiles" id="tiles"></ol>

    <div class="chooser">
      <h2 id="chooser-title"></h2>
      <div class="domains" id="domains" hidden></div>
      <div id="chips"></div>
      <div class="chooser-foot">
        <form class="custom" id="custom-form">
          <label for="custom-input">Or type your own</label>
          <div class="custom-row">
            <input id="custom-input" type="text" maxlength="60" autocomplete="off">
            <button class="btn" type="submit">Use mine</button>
          </div>
        </form>
        <button class="btn" id="spin" type="button">Spin for me</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="frame" type="button">Frame the question</button>
      <button class="btn" id="fill" type="button">Fill empty picks at random</button>
      <button class="btn" id="reset" type="button">New round</button>
    </div>
  </section>

  <section id="result" aria-live="polite" aria-label="Research question"></section>
</main>

<script>
/* Research Question Roulette: content. Loaded inline into the page. */
var RQR_DATA = (function () {
  'use strict';

  /* ---------- data sources ---------- */
  var S = {
    ehr: { name: "Your ED's electronic health record (chart review)", access: 'Your institution', note: 'Visit-level detail; plan a standardized abstraction form and train abstractors.' },
    rdw: { name: "Your health system's research data warehouse", access: 'Your institution', note: 'Bulk EHR extracts by query; ask your informatics or research IT team.' },
    redcap: { name: 'REDCap or Qualtrics', access: 'Usually free through your institution', note: 'Secure forms for prospective data collection and surveys.' },
    transcription: { name: 'Audio recording and transcription service', access: 'Institution-approved vendor', note: 'Needed for interview and focus-group studies.' },
    ctgov: { name: 'ClinicalTrials.gov', access: 'Free registration', note: 'Register the study before enrolling the first patient.' },
    pubmed: { name: 'PubMed / MEDLINE', access: 'Free', note: 'Core biomedical database for any review.' },
    embase: { name: 'Embase', access: 'Library subscription', note: 'Adds drug and European literature that MEDLINE misses.' },
    cochrane: { name: 'Cochrane Library (CENTRAL)', access: 'Library subscription', note: 'Best source for randomized trials.' },
    cinahl: { name: 'CINAHL', access: 'Library subscription', note: 'Nursing, EMS and allied health literature.' },
    prospero: { name: 'PROSPERO', access: 'Free registration', note: 'Register the systematic review protocol before screening.' },
    osf: { name: 'Open Science Framework (OSF)', access: 'Free registration', note: 'Where scoping review protocols are usually registered.' },

    nhamcs: { name: 'NHAMCS, ED component (CDC)', access: 'Free public download', note: 'National sample of US ED visits: diagnoses, tests, medications, disposition.' },
    neds: { name: 'HCUP Nationwide Emergency Department Sample (NEDS)', access: 'Paid, data use agreement', note: 'Largest all-payer US ED database; diagnoses, procedures, charges.' },
    nis: { name: 'HCUP National Inpatient Sample (NIS)', access: 'Paid, data use agreement', note: 'National hospital admissions, including those admitted from the ED.' },
    mimic: { name: 'MIMIC-IV-ED', access: 'Free after PhysioNet credentialing', note: 'Detailed de-identified ED visits from one Boston academic center.' },
    trinetx: { name: 'TriNetX or Epic Cosmos', access: 'Institutional access needed', note: 'De-identified EHR data across many health systems.' },
    ntdb: { name: 'ACS TQIP / National Trauma Data Bank', access: 'Application through ACS', note: 'Trauma center registry with injury severity and outcomes.' },
    cares: { name: 'CARES (Cardiac Arrest Registry to Enhance Survival)', access: 'Participating agencies; research application', note: 'Out-of-hospital cardiac arrest from 911 call to discharge.' },
    gwtg: { name: 'AHA Get With The Guidelines registries', access: 'Participating hospitals; research proposal', note: 'Stroke, resuscitation, heart failure and AFib modules.' },
    ncdr: { name: 'ACC NCDR Chest Pain-MI Registry', access: 'Participating hospitals', note: 'Chest pain and myocardial infarction care and outcomes.' },
    nemsis: { name: 'NEMSIS (National EMS Information System)', access: 'Free research dataset, application', note: 'National EMS activations, interventions and timings.' },
    pecarn: { name: 'PECARN public-use datasets and PECARN Registry', access: 'Public datasets free; registry via network sites', note: 'Pediatric emergency care studies and multi-site EHR registry.' },
    phis: { name: "PHIS (Pediatric Health Information System)", access: "Children's Hospital Association members", note: "Administrative and billing data from US children's hospitals." },
    nsqip: { name: 'ACS NSQIP-Pediatric', access: 'Participating hospitals', note: 'Surgical outcomes, including appendectomy.' },
    neiss: { name: 'NEISS and NEISS-AIP (CPSC)', access: 'Free public query and download', note: 'National injury surveillance from a sample of US EDs.' },
    wisqars: { name: 'CDC WISQARS', access: 'Free online', note: 'National injury deaths and nonfatal injury estimates.' },
    nvdrs: { name: 'NVDRS (National Violent Death Reporting System)', access: 'Restricted-access application', note: 'Detailed circumstances of suicides and homicides.' },
    npds: { name: "National Poison Data System (America's Poison Centers)", access: 'Application, fee', note: 'Every call to US poison centers: exposures, treatments, outcomes.' },
    toxic: { name: 'ToxIC Core Registry (ACMT)', access: 'Member sites; research proposal', note: 'Bedside medical toxicology consultations.' },
    dose: { name: 'CDC DOSE and SUDORS overdose surveillance', access: 'Public dashboards; restricted data by request', note: 'ED overdose visits and overdose death circumstances.' },
    kasper: { name: 'KASPER (Kentucky prescription monitoring program)', access: 'Restricted; research request to the state', note: 'Controlled-substance prescriptions filled in Kentucky.' },
    kiprc: { name: 'Kentucky Injury Prevention and Research Center (KIPRC)', access: 'Public dashboards; data requests', note: 'Kentucky injury, overdose and ED visit surveillance.' },
    nssp: { name: 'CDC NSSP syndromic surveillance', access: 'Through your state health department', note: 'Near-real-time ED visit data by syndrome.' },
    nvsn: { name: 'CDC NVSN, FluSurv-NET and RSV-NET', access: 'Public summary data; network sites', note: 'Respiratory virus hospitalizations and vaccine effectiveness.' },
    n3c: { name: 'N3C (National COVID Cohort Collaborative)', access: 'Free with institutional data use agreement', note: 'Harmonized EHR data on COVID-19 patients and controls.' },
    medicare: { name: 'Medicare claims (CMS, via ResDAC)', access: 'Paid, data use agreement', note: 'Older adults across ED, inpatient and outpatient care.' },
    marketscan: { name: 'MarketScan commercial claims', access: 'Paid license', note: 'Privately insured patients and their prescriptions.' },
    popsurvey: { name: 'BRFSS, NHIS and NSDUH population surveys', access: 'Free public download', note: 'Population prevalence of conditions, behaviors and substance use.' },
    prams: { name: 'PRAMS (Pregnancy Risk Assessment Monitoring System)', access: 'Free, application', note: 'Maternal experiences before, during and after pregnancy.' },
    wonder: { name: 'CDC WONDER', access: 'Free online', note: 'National death and birth statistics by cause and place.' },
    fars: { name: 'FARS (NHTSA Fatality Analysis Reporting System)', access: 'Free public download', note: 'Every fatal motor vehicle crash in the US.' },
    carecompare: { name: 'CMS Care Compare ED measures', access: 'Free public download', note: 'Hospital-level ED throughput times and related measures.' },
    edba: { name: 'Emergency Department Benchmarking Alliance survey', access: 'Member EDs', note: 'Annual ED operations metrics: volume, LWBS, boarding.' },
    near: { name: 'NEAR (National Emergency Airway Registry)', access: 'Participating sites', note: 'ED intubations: devices, drugs, first-pass success, adverse events.' },
    psrc: { name: 'Pediatric Sedation Research Consortium registry', access: 'Participating sites', note: 'Pediatric procedural sedation and adverse events.' },
    biolincc: { name: 'Completed NIH trial datasets (BioLINCC, NINDS archive)', access: 'Free, application', note: 'Reanalyze finished resuscitation, trauma and neurology trials.' },
    fitbir: { name: 'FITBIR (federal TBI research data, incl. TRACK-TBI)', access: 'Free, application', note: 'Traumatic brain injury studies with imaging and outcomes.' },
    adi: { name: 'Neighborhood Atlas (ADI) and CDC/ATSDR Social Vulnerability Index', access: 'Free public download', note: 'Link patient addresses to neighborhood disadvantage.' },
    noaa: { name: 'NOAA climate and heat-index data', access: 'Free public download', note: 'Link visit dates and places to temperature and weather.' },
    airnow: { name: 'EPA AirNow and AQS air-quality data', access: 'Free public download', note: 'Daily PM2.5 and ozone by monitor and county.' },
    atlas: { name: 'CDC AtlasPlus (HIV, hepatitis, STI surveillance)', access: 'Free online', note: 'County and state rates for comparison.' },
    hmis: { name: 'Local Homeless Management Information System (HMIS)', access: 'Data agreement with your Continuum of Care', note: 'Shelter and housing-service use, linkable to ED visits.' },
    crash: { name: 'State police crash records', access: 'Public request; varies by state', note: 'Crash circumstances, restraint use, location.' },
    fema: { name: 'FEMA disaster declarations and published after-action reports', access: 'Free online', note: 'Event timelines, scale and system response.' },
    npr: { name: 'National Pediatric Readiness Project assessment scores', access: 'Request through the project', note: "Each ED's weighted pediatric readiness score." },
    milestones: { name: "Your program's ACGME Milestones and evaluation data", access: 'Program access; needs IRB determination', note: 'Resident performance over time.' },
    instruments: { name: 'Validated survey instruments (Mini-Z, Maslach Burnout Inventory)', access: 'Mini-Z free; MBI licensed', note: 'Use a validated tool instead of writing your own questions.' },
    simlog: { name: 'Simulation center and procedure logs', access: 'Program access', note: 'Sessions completed, checklists, procedure counts.' },
    incident: { name: 'Hospital incident and safety reports', access: 'Patient safety office; needs approval', note: 'Reported events, including assaults on staff.' },
    usarch: { name: "Your department's ultrasound image archive", access: 'Your institution', note: 'Saved clips with indications and interpretations.' },
    kyhosp: { name: 'Kentucky hospital and ED discharge data (Cabinet for Health and Family Services)', access: 'Data request; fee may apply', note: 'Every ED visit and admission in Kentucky hospitals.' },
    localreg: { name: 'Local hospital registers and logbooks', access: 'Site permission', note: 'Often paper; a prospective registry may be the better design.' }
  };

  /* ---------- topics ---------- */
  function T(domain, label, noun, cohort, exposure, outcome, intervention, o) {
    o = o || {};
    return {
      domain: domain, label: label, noun: noun, cohort: cohort, exposure: exposure, outcome: outcome,
      intervention: intervention, rare: o.rare || [], src: o.src || [], sex: o.sex || '', efic: !!o.efic, staff: !!o.staff
    };
  }
  var KIDS = ['infants', 'children'];
  var KIDS3 = ['infants', 'children', 'adolescents'];
  var ADULTS = ['young', 'middle', 'older'];

    topic: find(DATA.TOPICS, 'Sepsis'),
    loc: find(DATA.LOCS, 'Rural critical access hospital'),
    time: find(DATA.TIMES, 'Past 10 years'),
    age: find(DATA.AGES, 'Older adults'),
    gender: find(DATA.GENDERS, 'Women'),
    design: find(DATA.DESIGNS, 'Retrospective cohort study')
  };
  var active = 0;
  var framed = true;
  var example = true;
  var busy = false;
  var domainSel = picks.topic.domain;
  var DOMAINS = uniq(DATA.TOPICS.map(function (t) { return t.domain; }));

  function allFilled() { return SLOTS.every(function (s) { return picks[s.key]; }); }
  function nextEmpty(from) {
    for (var k = 1; k <= SLOTS.length; k++) {
      var j = (from + k) % SLOTS.length;
      if (!picks[SLOTS[j].key]) return j;
    }
    return -1;
  }

  /* ---------- render ---------- */
  function renderTiles() {
    var ol = $('#tiles');
    ol.replaceChildren();
    SLOTS.forEach(function (s, i) {
      var li = el('li');
      var b = el('button', 'tile');
      b.type = 'button';
      if (i === active) b.setAttribute('aria-current', 'true');
      b.append(el('span', 'what', s.name));
      var v = picks[s.key];
      b.append(el('span', v ? 'val' : 'val empty', v ? v.label : 'Waiting for a pick'));
      b.addEventListener('click', function () {
        if (busy) return;
        active = i;
        if (s.key === 'topic' && picks.topic && picks.topic.domain && DOMAINS.indexOf(picks.topic.domain) !== -1) domainSel = picks.topic.domain;
        renderTiles();
        renderChooser();
      });
      li.append(b);
      ol.append(li);
    });
  }

  function chipList(s, opts) {
    var ul = el('ul', 'chips');
    var cur = picks[s.key];
    opts.forEach(function (o) {
      var li = el('li');
      var b = el('button', 'chip', o.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', cur && cur.label === o.label ? 'true' : 'false');
      b.addEventListener('click', function () { if (!busy) pick(active, o); });
      li.append(b);
      ul.append(li);
    });
    return ul;
  }

  function renderChooser() {
    var s = SLOTS[active];
    $('#chooser-title').textContent = 'Pick ' + s.ask;
    var dom = $('#domains');
    var box = $('#chips');
    box.replaceChildren();
    dom.replaceChildren();
    dom.hidden = !s.domains;
    if (s.domains) {
      DOMAINS.forEach(function (d) {
        var b = el('button', 'domain');
        b.type = 'button';
        b.append(document.createTextNode(d));
        var n = DATA.TOPICS.filter(function (t) { return t.domain === d; }).length;
        b.append(el('span', 'n', String(n)));
        b.setAttribute('aria-pressed', d === domainSel ? 'true' : 'false');
        b.addEventListener('click', function () { domainSel = d; renderChooser(); });
        dom.append(b);
      });
      box.append(chipList(s, s.opts.filter(function (t) { return t.domain === domainSel; })));
    } else if (s.groups) {
      var wrap = el('div', 'stack');
      s.groups.forEach(function (g) {
        var items = s.opts.filter(function (o) { return o[s.groupKey] === g[0]; });
        if (!items.length) return;
        var grp = el('div', 'group');
        grp.append(el('p', 'group-h', g[1]));
        grp.append(chipList(s, items));
        wrap.append(grp);
      });
      box.append(wrap);
    } else {
      box.append(chipList(s, s.opts));
    }
    $('#custom-form').hidden = !!s.noCustom;
    $('#custom-input').placeholder = s.hint || '';
  }

  function sourceList(keys) {
    var ul = el('ul', 'sources');
    keys.forEach(function (k) {
      var s = S[k];
      var li = el('li', 'src');
      li.append(el('span', 'src-name', s.name));
      li.append(el('span', 'src-access', s.access));
      li.append(el('span', 'src-note', s.note));
      ul.append(li);
    });
    return ul;
  }

  function renderResult() {
    var box = $('#result');
    box.replaceChildren();
    var open = SLOTS.filter(function (s) { return !picks[s.key]; }).length;
    if (!framed || open) {
      var e = el('div', 'empty-state');
      e.append(el('h2', null, 'Your question appears here'));
      e.append(el('p', null, open
        ? open + ' of 6 picks still open. Fill them in turn, or fill the empty ones at random.'
        : 'All six picks are in. Press Frame the question.'));
      box.append(e);
      return;
    }
    var D = picks.design;
    var r = build(picks);
    var card = el('article', 'result');
    card.append(el('p', 'tag', example ? 'Example round. Press New round to run it live.' : 'Your research question'));
    var q = el('p', 'question', r.q);
    q.id = 'question';
    card.append(q);

    var dl0 = el('p', 'design-line');
    dl0.append(el('span', 'design-name', D.label));
    var irbPill = el('span', 'pill ' + r.irb.cls, 'IRB: ' + r.irb.level);
    dl0.append(irbPill);
    dl0.append(el('span', 'pill neutral', r.hours.lo + ' to ' + r.hours.hi + ' hours'));
    card.append(dl0);

    if (r.warns.length) {
      var w = el('div', 'warns');
      r.warns.forEach(function (x) {
        var p = el('p', 'heads');
        p.append(el('b', null, 'Heads up'));
        p.append(document.createTextNode(x));
        w.append(p);
      });
      card.append(w);
    }

    var panels = el('div', 'panels');

    // breakdown
    var pb = el('section', 'panel');
    pb.append(el('h3', null, 'Breakdown'));
    var dl = el('dl', 'meta');
    r.rows.forEach(function (row) { dl.append(el('dt', null, row[0])); dl.append(el('dd', null, row[1])); });
    pb.append(dl);
    panels.append(pb);

    // hours
    var ph = el('section', 'panel');
    ph.append(el('h3', null, 'Hours to a manuscript'));
    var big = el('p', 'hours-big', r.hours.lo.toLocaleString('en-US') + '–' + r.hours.hi.toLocaleString('en-US'));
    big.append(el('small', null, 'hours of work'));
    ph.append(big);
    ph.append(el('p', 'sub', 'Usually spread over ' + r.hours.months + ' months of calendar time.'));
    var ul = el('ul', 'phases');
    var mids = r.hours.phases.map(function (x) { return (x[0] + x[1]) / 2; });
    var maxMid = Math.max.apply(null, mids);
    r.hours.phases.forEach(function (x, i) {
      var li = el('li', 'phase' + (mids[i] === maxMid ? ' lead' : ''));
      li.append(el('span', null, DATA.PH[i]));
      li.append(el('span', 'num', x[0] + '–' + x[1] + ' h'));
      var tr = el('span', 'track');
      var f = el('span', 'fill');
      f.style.display = 'block';
      f.style.width = Math.max(2, Math.round(mids[i] / maxMid * 100)) + '%';
      tr.append(f);
      li.append(tr);
      ul.append(li);
    });
    ph.append(ul);
    if (r.hours.mods.length) {
      var ml = el('ul', 'small-list');
      r.hours.mods.forEach(function (m) { ml.append(el('li', null, m)); });
      ph.append(ml);
    }
    ph.append(el('p', 'fine', D.id === 'sr'
      ? 'For comparison, Allen and Olkin (1999) found a median of about 1,110 hours per meta-analysis (range 216 to 2,518). Borah and colleagues (2017) found reviews took a mean of 67 weeks with about 5 authors.'
      : 'Rough planning estimates for one person working with a mentor and a statistician. Working hours, not calendar time; real projects vary widely.'));
    panels.append(ph);

    // IRB
    var pi = el('section', 'panel');
    pi.append(el('h3', null, 'Do you need the IRB?'));
    var lv = el('p', 'design-line');
    lv.append(el('span', 'pill ' + r.irb.cls, r.irb.level));
    pi.append(lv);
    pi.append(el('p', null, r.irb.text));
    if (r.irb.notes.length) {
      var nl = el('ul', 'small-list');
      r.irb.notes.forEach(function (n) { nl.append(el('li', null, n)); });
      pi.append(nl);
    }
    pi.append(el('p', 'fine', 'General US rules. Your institution’s IRB makes the final call, so submit early and ask for a determination when unsure.'));
    panels.append(pi);

    // data
    var pd = el('section', 'panel');
    pd.append(el('h3', null, 'Where to find the data'));
    if (D.id === 'db') {
      if (r.topicSrc.length) {
        pd.append(el('p', 'src-h', 'Candidate databases for this topic'));
        pd.append(sourceList(r.topicSrc));
      } else {
        pd.append(el('p', 'sub', 'No national database is listed for this topic yet.'));
      }
    } else {
      if (r.designSrc.length) {
        pd.append(el('p', 'src-h', 'For this design'));
        pd.append(sourceList(r.designSrc));
      }
      if (r.topicSrc.length) {
        pd.append(el('p', 'src-h', 'Existing datasets on this topic'));
        pd.append(sourceList(r.topicSrc));
      }
    }
    panels.append(pd);
    card.append(panels);

    card.append(renderSimilar(picks.topic));

    var d = el('div', 'discuss');
    d.append(el('h3', null, 'Argue about it'));
    var pl = el('ul');
    r.prompts.forEach(function (x) { pl.append(el('li', null, x)); });
    d.append(pl);
    card.append(d);

    var act = el('div', 'actions');
    var again = el('button', 'btn', 'Try another design');
    again.type = 'button';
    again.addEventListener('click', function () {
      var others = DATA.DESIGNS.filter(function (x) { return x !== picks.design; });
      picks.design = rnd(others);
      example = false;
      renderTiles();
      if (SLOTS[active].key === 'design') renderChooser();
      renderResult();
    });
    var copy = el('button', 'btn', 'Copy question');
    copy.type = 'button';
    var status = el('span', 'status');
    status.setAttribute('role', 'status');
    copy.addEventListener('click', function () { copyQuestion(status); });
    act.append(again, copy, status);
    card.append(act);
    box.append(card);
  }

  function useTopic(t) {
    picks.topic = t;
    liveTerm = '';
    if (DOMAINS.indexOf(t.domain) !== -1) domainSel = t.domain;
    example = false;
    renderTiles();
    if (SLOTS[active].key === 'topic') renderChooser();
    renderResult();
  }

  function topicChips(list) {
    var ul = el('ul', 'chips');
    list.forEach(function (t) {
      var li = el('li');
      var b = el('button', 'chip', t.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { useTopic(t); });
      li.append(b);
      ul.append(li);
    });
    return ul;
  }

  function renderSimilar(T) {
    var sec = el('section', 'similar');
    sec.append(el('h3', null, T.custom ? 'Similar research on “' + T.label + '”' : 'Search for similar studies'));
    sec.append(el('p', 'sub', 'Each button opens a new tab with the search already run.'));
    var links = el('div', 'links');
    searchLinks(T).forEach(function (l) {
      var a = el('a', 'btn');
      a.href = l.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.append(document.createTextNode(l.label));
      a.append(el('span', 'arrow', '↗'));
      links.append(a);
    });
    sec.append(links);
    if (LIVE) sec.append(liveBox(T, picks.design));
    if (!T.custom) return sec;

    var sim = similarTopics(T.label, 3);
    if (sim.length) {
      sec.append(el('p', 'src-h', 'Closest topics already in the roulette'));
      sec.append(topicChips(sim));
    }

    return sec;
  }

  function copyQuestion(status) {
    var q = document.getElementById('question');
    var text = q.textContent;
    var done = function () { status.textContent = 'Copied'; };
    var fallback = function () {
      try {
        var range = document.createRange();
        range.selectNodeContents(q);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (e) { /* selection unavailable */ }
      status.textContent = 'Selected. Press Ctrl+C or Cmd+C to copy.';
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function renderAll() {
    renderTiles();
    renderChooser();
    $('#frame').disabled = !allFilled();
    renderResult();
  }

  /* ---------- actions ---------- */
  function pick(i, opt) {
    picks[SLOTS[i].key] = opt;
    if (SLOTS[i].key === 'topic') liveTerm = '';
    if (SLOTS[i].key === 'topic' && opt.domain && DOMAINS.indexOf(opt.domain) !== -1) domainSel = opt.domain;
    example = false;
    framed = false;
    var n = nextEmpty(i);
    if (n !== -1) active = n;
    $('#custom-input').value = '';
    renderAll();
  }

  function spin(i) {
    if (busy) return;
    var s = SLOTS[i];
    var cur = picks[s.key];
    var pool = s.opts.filter(function (o) { return !cur || o.label !== cur.label; });
    var target = rnd(pool);
    if (reduce) { pick(i, target); return; }
    busy = true;
    active = i;
    renderTiles();
    renderChooser();
    var valEl = document.querySelector('#tiles li:nth-child(' + (i + 1) + ') .val');
    var n = 0;
    var timer = setInterval(function () {
      valEl.textContent = rnd(s.opts).label;
      valEl.className = 'val';
      n += 1;
      if (n >= 12) { clearInterval(timer); busy = false; pick(i, target); }
    }, 65);
  }

  $('#custom-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    var s = SLOTS[active];
    if (s.noCustom) return;
    var v = $('#custom-input').value.trim();
    if (!v) return;
    pick(active, s.custom(v));
  });
  $('#spin').addEventListener('click', function () { spin(active); });
  $('#frame').addEventListener('click', function () {
    if (!allFilled()) return;
    framed = true;
    example = false;
    renderResult();
  });
  $('#fill').addEventListener('click', function () {
    if (busy) return;
    if (!picks.topic) liveTerm = '';
    SLOTS.forEach(function (s) { if (!picks[s.key]) picks[s.key] = rnd(s.opts); });
    if (picks.topic && picks.topic.domain && DOMAINS.indexOf(picks.topic.domain) !== -1) domainSel = picks.topic.domain;
    example = false;
    framed = false;
    renderAll();
  });
  $('#reset').addEventListener('click', function () {
    if (busy) return;
    picks = {};
    active = 0;
    liveTerm = '';
    framed = false;
    example = false;
    $('#custom-input').value = '';
    renderAll();
  });

  window.__rqr = { fetchLive: fetchLive, build: build, SLOTS: SLOTS, DATA: DATA, similarTopics: similarTopics, searchLinks: searchLinks };
  renderAll();
})();
</script>

</body>
</html>
